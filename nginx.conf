server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy API calls to superadmin-api (which has global prefix api/v1)
    location /api {
        # Docker's embedded DNS — re-resolve on each request instead of
        # caching the upstream IP for the worker's lifetime (that cache
        # goes stale if superadmin-api is recreated/redeployed).
        resolver 127.0.0.11 valid=10s;
        set $superadmin_api superadmin-api;
        proxy_pass http://$superadmin_api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Content-hashed build assets (Vite emits /assets/*-[hash].js|css) — the
    # filename changes whenever the content does, so they're safe to cache
    # forever. A missing asset 404s rather than falling back to index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all unknown paths serve index.html.
    #
    # index.html is NOT content-hashed and points at the current build's hashed
    # assets, so it must never be cached — otherwise a browser keeps loading a
    # stale index.html (and thus the old JS bundle) after a new deploy. This
    # rule was only in mandir-web's config, which is why a favicon change
    # deployed here on 2026-08-13 kept showing the old icon: the browser never
    # re-fetched index.html. no-cache = always revalidate, so updates show on
    # the next reload. It also covers the un-hashed root files (favicon.svg,
    # favicon-32.png, apple-touch-icon.png, logo.svg).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
