name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # ESLint was never installed in this repo until 2026-08-04; the config is a
      # baseline that errors on real defects and warns on the rest.
      - run: npm run lint
      # `tsc -b && vite build` — the typecheck must pass before bundling.
      - run: npm run build
