# ---------------------------------------------------------------------------
# PRODUCTION deploy -> Cloud Run, asia-south1.   [1 of 2 workflows in this repo]
#
#   main  -> dev  (AWS EC2)      .github/workflows/dev.yml
#   prod  -> prod (GCP Cloud Run) THIS FILE
#
# Merge main into `prod` when you want to ship. Nothing else deploys here.
#
# SELF-CONTAINED ON PURPOSE. This used to call a reusable workflow, which meant
# four workflows in the Actions list for two actual jobs, and a vendored copy of
# the reusable one in every repo anyway (private repos cannot share reusable
# workflows on this plan). Inlined: one file, one job, nothing to cross-check.
#
# APPROVAL GATED. The `production` environment requires a reviewer, so a push to
# `prod` queues and burns NO Actions minutes until you approve it. That gate is
# also load-bearing for auth: the WIF binding in gcp/modules/wif-github matches
# attribute.repo_env = "<owner>/<repo>:production", so a job without this
# `environment:` line gets no environment claim in its OIDC token and cannot
# authenticate to GCP at all.
#
# The docker build runs on CLOUD BUILD, not this runner - see cloudbuild.yaml.
# ---------------------------------------------------------------------------

name: Deploy to production (GCP)

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  # Per service: two merges in quick succession must not race each other
  # through the traffic shift.
  group: deploy-prod-superadmin-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write # required for WIF; nothing else needs write

    steps:
      - name: Check the caller passed everything
        env:
          IMAGE_REPO: ${{ secrets.GCP_IMAGE_REPO }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          set -euo pipefail
          missing=0
          for v in IMAGE_REPO WIF_PROVIDER DEPLOY_SA; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty. Set the repository variable that feeds it - see doc-v2/GCP_CICD_Runbook.md §3."
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - uses: actions/checkout@v4


      - name: Authenticate to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: tsq-jainerp-prod

      - name: Pin gcloud to the target project
        # google-github-actions/auth writes CLOUDSDK_CORE_PROJECT into
        # $GITHUB_ENV, set to the SERVICE ACCOUNT's project (tsq-ci, where the
        # deploy identities live). That beats both `gcloud config set project`
        # AND a job-level `env:` block, because a $GITHUB_ENV write overrides
        # job env for every later step. So setup-gcloud's project_id was being
        # silently ignored and every bare `gcloud` call ran against tsq-ci.
        #
        # Writing the same keys to $GITHUB_ENV again, from a LATER step, is what
        # actually wins - last write to $GITHUB_ENV takes effect.
        #
        # The symptom was a confident lie rather than an error. `gcloud run
        # services describe superadmin-api` found nothing in tsq-ci, so the
        # workflow announced "superadmin-api does not exist yet - this run
        # creates it and takes 100% traffic immediately", and later
        # "Cloud Run Job 'db-bootstrap' does not exist". Both exist, in
        # tsq-jainerp-prod. Diagnosed 2026-08-17 from the env dump in the log.
        run: |
          set -euo pipefail
          for k in CLOUDSDK_CORE_PROJECT CLOUDSDK_PROJECT GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT GCP_PROJECT; do
            echo "$k=tsq-jainerp-prod" >> "$GITHUB_ENV"
          done
          echo "pinned gcloud project to tsq-jainerp-prod"

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail
          host="$(echo "${{ secrets.GCP_IMAGE_REPO }}" | cut -d/ -f1)"
          gcloud auth configure-docker "$host" --quiet

      # ---------------------------------------------------------------------
      # Build.
      #
      # The tag is the commit SHA, and only the SHA. The Artifact Registry repo
      # is created with immutable_tags = true, so re-running this workflow on
      # the same commit would otherwise fail on the push. Instead: if the SHA
      # tag is already there, reuse it. Re-running a deploy is then idempotent
      # and cannot quietly ship a different build of the same commit.
      #
      # :latest is never pushed and never deployed (§5).
      # ---------------------------------------------------------------------
      - name: Resolve or build the image
        id: image
        env:
          IMAGE: ${{ secrets.GCP_IMAGE_REPO }}/superadmin-web
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if digest="$(gcloud artifacts docker images describe "$IMAGE:$SHA" \
                        --format='value(image_summary.digest)' 2>/dev/null)" \
             && [ -n "$digest" ]; then
            echo "image for $SHA already in Artifact Registry, reusing $digest"
          else
            # BUILT BY CLOUD BUILD, NOT THIS RUNNER.
            #
            # The org exhausted its 2,000 free GitHub Actions minutes in August
            # 2026 and every private-repo workflow stopped. The docker build is
            # the expensive part of a deploy - two npm install passes per image,
            # across eight repos - and the part that least needs a GitHub runner.
            #
            # Actions still owns the pipeline: approval gate, WIF auth, deploy,
            # traffic shift, verification. Only the build moves, onto a US$2,000
            # GCP credit expiring 16 July 2027 that is barely touched, plus 120
            # free build-minutes a day.
            #
            # --service-account is required: builds run as sa-cloudbuild, and
            # the legacy default @cloudbuild.gserviceaccount.com identity is no
            # longer created for new projects.
            gcloud builds submit               --project="tsq-artifacts"               --config=cloudbuild.yaml               --service-account="projects/tsq-artifacts/serviceAccounts/sa-cloudbuild@tsq-artifacts.iam.gserviceaccount.com"               --substitutions="_IMAGE=$IMAGE,_TAG=$SHA,_DOCKERFILE=./Dockerfile"               "."
            digest="$(gcloud artifacts docker images describe "$IMAGE:$SHA" \
                        --format='value(image_summary.digest)')"
          fi
          echo "ref=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "deploying $IMAGE@$digest"

      # ---------------------------------------------------------------------
      # Remember what is serving now. Everything after this point can fail, and
      # the rollback step needs a revision name to go back to. Captured before
      # the deploy, because after it the "previous" revision is ambiguous.
      # ---------------------------------------------------------------------
      - name: Record the currently serving revision
        id: current
        env:
          SERVICE: superadmin-web
          REGION: asia-south1
        run: |
          set -euo pipefail
          if ! gcloud run services describe "$SERVICE" --region="$REGION" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$SERVICE does not exist yet - this run creates it and takes 100% traffic immediately (there is no other revision to hold traffic)."
            exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          rev="$(gcloud run services describe "$SERVICE" --region="$REGION" \
                  --format=json | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName // ""')"
          echo "revision=$rev" >> "$GITHUB_OUTPUT"
          echo "currently serving: ${rev:-<none>}"

      # ---------------------------------------------------------------------
      # Migrations, before any traffic moves (§3.1).
      #
      # DbBootstrapService replays init.sql + ~61 migration files against every
      # database on container start. On Cloud Run that would race across
      # concurrently starting instances, so the Cloud Run services run with
      # RUN_DB_BOOTSTRAP=false and this Job - the same image, the flag on - is
      # the only thing that runs DDL. If it fails, the deploy stops here and
      # the old revision is still serving.
      # ---------------------------------------------------------------------
      - name: Run the database bootstrap job
        if: false
        env:
          JOB: db-bootstrap
          REGION: asia-south1
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if ! gcloud run jobs describe "$JOB" --region="$REGION" >/dev/null 2>&1; then
            echo "::error::Cloud Run Job '$JOB' does not exist. It is created by the prod Terraform (PROD_GCP_SETUP_PROMPT.md Phase 2), not by this workflow."
            exit 1
          fi
          # Point the Job at the image about to ship, so the schema matches the
          # code that will run against it. `jobs execute` cannot override the
          # image - its overrides are limited to args, env vars, task count and
          # timeouts - so this is update-then-execute, not one call.
          #
          # The Job's other settings (service account, secrets, VPC egress)
          # belong to Terraform, which must ignore_changes on the image for the
          # same reason the services do.
          gcloud run jobs update "$JOB" \
            --region="$REGION" \
            --image="$IMAGE_REF" \
            --quiet
          gcloud run jobs execute "$JOB" \
            --region="$REGION" \
            --wait

      # ---------------------------------------------------------------------
      # Deploy without traffic.
      #
      # Only --image and the revision tag are passed. Everything else - service
      # account, env vars, secret refs, VPC egress, scaling bounds - is owned by
      # Terraform. Passing them here too is how a Cloud Run service ends up with
      # settings that exist in no repository.
      # ---------------------------------------------------------------------
      - name: Deploy the new revision
        id: deploy
        env:
          SERVICE: superadmin-web
          REGION: asia-south1
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          EXISTS: ${{ steps.current.outputs.exists }}
        run: |
          set -euo pipefail
          rev_tag="r$(echo "${{ github.sha }}" | cut -c1-7)"
          if [ "$EXISTS" = "true" ]; then
            gcloud run deploy "$SERVICE" \
              --region="$REGION" \
              --image="$IMAGE_REF" \
              --tag="$rev_tag" \
              --no-traffic \
              --quiet
          else
            gcloud run deploy "$SERVICE" \
              --region="$REGION" \
              --image="$IMAGE_REF" \
              --tag="$rev_tag" \
              --quiet
          fi
          new_rev="$(gcloud run services describe "$SERVICE" --region="$REGION" \
                      --format='value(status.latestCreatedRevisionName)')"
          echo "tag=$rev_tag"       >> "$GITHUB_OUTPUT"
          echo "revision=$new_rev"  >> "$GITHUB_OUTPUT"
          echo "created revision $new_rev (tag $rev_tag)"

      # ---------------------------------------------------------------------
      # Health gate.
      #
      # NOTE ON WHY THIS DOES NOT curl THE *.run.app URL.
      #
      # The org policy run.allowedIngress (envs/10-org/org_policies.tf) pins
      # every Cloud Run service in the jainerp folder to
      # internal-and-cloud-load-balancing. The tagged revision URL is therefore
      # NOT reachable from a GitHub runner - by design, and Runbook §1.6 tests
      # exactly that. A curl against it would fail on a perfectly healthy
      # revision, so the gate would either be permanently red or, worse, get
      # "fixed" by widening the ingress policy.
      #
      # What is a real signal: Cloud Run marks a revision Ready only after the
      # container starts and passes its startup probe. The prod Terraform sets
      # that probe to GET the service's health path, so Ready means the app
      # answered its own health check inside the perimeter. External
      # verification happens after the traffic shift, through the load balancer,
      # via verify_url.
      # ---------------------------------------------------------------------
      - name: Wait for the revision to become Ready
        env:
          REGION: asia-south1
          REV: ${{ steps.deploy.outputs.revision }}
          TIMEOUT: 300
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + TIMEOUT ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json="$(gcloud run revisions describe "$REV" --region="$REGION" --format=json)"
            state="$(echo "$json" | jq -r '[.status.conditions[] | select(.type=="Ready")][0].status // "Unknown"')"
            case "$state" in
              True)
                echo "revision $REV is Ready"
                exit 0
                ;;
              False)
                reason="$(echo "$json" | jq -r '[.status.conditions[] | select(.type=="Ready")][0].message // "no message"')"
                echo "::error::revision $REV failed to start: $reason"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::revision $REV did not become Ready within ${TIMEOUT}s"
          exit 1

      - name: Shift 100% of traffic to the new revision
        env:
          SERVICE: superadmin-web
          REGION: asia-south1
          REV: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --to-revisions="$REV=100" \
            --quiet

      - name: Verify through the load balancer
        # The emptiness check is INSIDE the script, not in an `if:`.
        # `secrets` is not available in an if: condition either - GitHub
        # rejects the whole file with "Unrecognized named-value: 'secrets'".
        # That is the third place the secrets context is refused, after
        # `with:` on a reusable call and `vars.`-vs-Secrets. Reading it into
        # env: and testing the variable in bash sidesteps all of them.
        env:
          URL: ${{ secrets.PROD_VERIFY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ]; then
            echo "PROD_VERIFY_URL is not set - skipping the post-shift check."
            echo "This SKIPS verification; it does not silently pass it."
            exit 0
          fi
          for i in $(seq 1 20); do
            if curl -fsS -m 10 "$URL" >/dev/null; then
              echo "verified $URL after $i attempt(s)"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL did not answer after the traffic shift"
          exit 1

      - name: Confirm what is actually serving
        env:
          SERVICE: superadmin-web
          REGION: asia-south1
          REV: ${{ steps.deploy.outputs.revision }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          serving="$(gcloud run services describe "$SERVICE" --region="$REGION" \
                      --format=json | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName // ""')"
          if [ "$serving" != "$REV" ]; then
            echo "::error::expected $REV to serve 100%, but $serving does"
            exit 1
          fi
          echo "$SERVICE is serving $REV ($IMAGE_REF)"

      # ---------------------------------------------------------------------
      # Auto-rollback (§5). Only meaningful when there WAS a previous revision;
      # on a first-ever deploy there is nothing to go back to and the failure
      # is left standing rather than hidden.
      # ---------------------------------------------------------------------
      - name: Roll back
        if: ${{ failure() && steps.current.outputs.exists == 'true' && steps.current.outputs.revision != '' }}
        env:
          SERVICE: superadmin-web
          REGION: asia-south1
          PREV: ${{ steps.current.outputs.revision }}
        run: |
          set -euo pipefail
          echo "::warning::deploy failed - restoring $PREV to 100% traffic"
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --to-revisions="$PREV=100" \
            --quiet
          echo "rolled back to $PREV"
