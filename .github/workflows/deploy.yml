name: Build & Deploy (superadmin-web)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-superadmin-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tasqbots/jainerp-superadmin-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy on EC2 (restart superadmin-web only)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" \
            "cd /opt/jainerp && \
             echo $GHCR_PAT | docker login ghcr.io -u $GHCR_USER --password-stdin && \
             docker system prune -f && \
             docker compose -f docker-compose.aws.yml --env-file .env.aws pull superadmin-web && \
             docker compose -f docker-compose.aws.yml --env-file .env.aws up -d superadmin-web"
          rm -f /tmp/deploy_key
