# ---------------------------------------------------------------------------
# DEV deploy -> the shared AWS EC2 box.        [1 of 2 workflows in this repo]
#
#   main  -> dev  (AWS EC2)       THIS FILE
#   prod  -> prod (GCP Cloud Run) .github/workflows/prod.yml
#
# APPROVAL / PASSWORD GATED.
# Triggered manually via workflow_dispatch with a required password verified
# against the `development` environment secret `DEPLOY_PASS`.
# ---------------------------------------------------------------------------
name: Build & Deploy (superadmin-web)

on:
  # MANUAL ONLY - there is deliberately no `push:` trigger.
  workflow_dispatch:
    inputs:
      deploy_pass:
        description: 'Enter DEPLOY_PASS to authorize this dev deployment'
        required: true
        type: number

concurrency:
  group: deploy-superadmin-web
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/tasqbots/jainerp-superadmin-web

jobs:
  # Runs password validation against the `development` environment first,
  # then lints and builds before allowing build-and-deploy to start.
  verify:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Validate DEPLOY_PASS
        env:
          INPUT_PASS: ${{ inputs.deploy_pass }}
          EXPECTED_PASS: ${{ secrets.DEPLOY_PASS }}
        run: |
          if [ -z "$EXPECTED_PASS" ]; then
            echo "::error::DEPLOY_PASS secret is not set in the 'development' environment."
            exit 1
          fi
          if [ "$INPUT_PASS" != "$EXPECTED_PASS" ]; then
            echo "::error::Invalid deployment password provided. Aborting deploy."
            exit 1
          fi
          echo "Deploy password verified." >>$GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx is what makes the GitHub Actions layer cache below usable.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy on EC2 (superadmin-web only)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" \
            GHCR_PAT="$GHCR_PAT" GHCR_USER="$GHCR_USER" TAG="${{ github.sha }}" 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/jainerp

          # Serialise with every other repo's deploy on this box. 600s is well
          # past a normal deploy, so a stuck job fails loudly instead of hanging.
          exec 9>/var/lock/jainerp-deploy.lock
          if ! flock -w 600 9; then
            echo "::error::timed out waiting for the shared deploy lock"
            exit 1
          fi

          if ! echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
            echo "::error::docker login to ghcr.io failed on the box. GHCR_PAT is expired or missing read:packages, or GHCR_USER is wrong. Nothing below this can succeed."
            exit 1
          fi

          # Start exactly the image this run built, not whatever :latest points
          # at by the time compose gets there.
          export SUPERADMIN_WEB_TAG="$TAG"
          COMPOSE="docker compose -f docker-compose.aws.yml --env-file .env.aws"
          if ! $COMPOSE pull superadmin-web; then
            echo "::error::could not pull $TAG. That is registry access or a missing tag, not the app."
            exit 1
          fi

          # Recreate, retrying once on the transient "No such container" race.
          up() { $COMPOSE up -d --force-recreate --no-deps --remove-orphans superadmin-web; }
          if ! up; then
            echo "compose up failed - retrying once after 5s..."
            sleep 5
            up || echo "compose up failed twice"
          fi

          # Health-gate: it must actually serve, else fail the deploy.
          ok=0
          for i in $(seq 1 20); do
            if curl -fs -m 5 http://localhost:8080/ >/dev/null 2>&1; then
              ok=1; echo "health OK after ${i} tries"; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::superadmin-web did not become healthy after deploy"
            docker ps -a --filter name=jainerp-superadmin-web --format "{{.Names}} {{.Status}}"
            docker logs --tail 40 jainerp-superadmin-web 2>&1 | grep -viE "password|secret" || true
            exit 1
          fi

          # Prove the running container is the image this run pushed.
          running="$(docker inspect --format '{{.Config.Image}}' jainerp-superadmin-web 2>/dev/null || echo unknown)"
          echo "running image: $running"
          case "$running" in
            *:"$TAG") echo "deploy healthy, serving $TAG." ;;
            *) echo "::error::jainerp-superadmin-web is serving $running, expected tag$TAG"; exit 1 ;;
          esac

          # PERSIST THE TAG, so nothing can silently roll this service back.
          touch .env.aws
          sed -i "/^SUPERADMIN_WEB_TAG=/d" .env.aws
          echo "SUPERADMIN_WEB_TAG=$TAG" >> .env.aws
          echo "pinned SUPERADMIN_WEB_TAG=$TAG in .env.aws"
          REMOTE
          rm -f /tmp/deploy_key
