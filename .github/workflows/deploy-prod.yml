# ---------------------------------------------------------------------------
# Production deploy for superadmin-web -> Cloud Run, asia-south1.
#
# Vite SPA served by nginx. The image is identical to the one the dev box runs - the SPAs call relative /api and the load balancer matches /api/* before the request reaches this container, so nginx.conf's Docker-network proxy_pass is simply never exercised here.
#
# This file does NOT replace deploy.yml. That one still ships every push to
# main onto the shared AWS dev box and must keep working exactly as it does
# today. This one only ever runs from a v* tag and only ever touches GCP.
#
# The deploy logic lives in .github/workflows/deploy-cloudrun.yml IN THIS REPO -
# a VENDORED COPY of the one in Tasqbots/jainerp-deploy.
#
# Why a copy rather than `uses: Tasqbots/jainerp-deploy/...@main`: both repos are
# private, and cross-repo reusable workflows from a private repo need the
# Settings -> Actions -> General -> "Access" option, which this organisation's
# plan does not offer. GitHub reports the resulting failure as
# `workflow was not found`, which reads like a missing file rather than a
# permissions limit. Verified 2026-08-17.
#
# THE COST: the deploy procedure now lives in eight places. Change it in
# jainerp-deploy first, then copy that file into every app repo. There is no
# automation enforcing they stay in sync.
#
# THE ONE UPSIDE: a local `uses: ./...` resolves at the caller's own commit, so
# there is no moving @main ref pointing into production.
#
# Before the first run, two things must be true:
#   1. the 'production' environment exists in THIS repo, with required reviewers
#   2. these four exist in the repo/org **Variables** tab - NOT Secrets:
#        GCP_IMAGE_REPO  GCP_WIF_PROVIDER  GCP_DEPLOY_SA  PROD_VERIFY_URL
#
# THE VARIABLES TAB IS NOT A PREFERENCE, IT IS THE ONLY OPTION. A reusable
# workflow's `with:` block cannot see the `secrets` context at all - GitHub
# rejects the file outright with:
#     Unrecognized named-value: 'secrets'
# Only github, needs, vars and inputs are available there. Storing these as
# secrets instead makes vars.* resolve to empty, and the guard in
# deploy-cloudrun.yml then fails with 'IMAGE_REPO is empty'. Both failure
# modes were hit on 2026-08-17; neither error names the real cause.
#
# (Passing them under a `secrets:` block instead would work, but it would
# mean redeclaring all four as secrets in the reusable workflow, and GitHub
# masks secret values in logs - so the image path and SA email would print
# as *** exactly when a failed push or auth call needs them readable. None
# of these is sensitive: WIF exists so there is no credential to leak.)
# See doc-v2/GCP_CICD_Runbook.md §3.
# ---------------------------------------------------------------------------

name: Deploy to production (GCP)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-cloudrun.yml
    with:
      service: superadmin-web
      run_migrations: false
      image_repo: ${{ vars.GCP_IMAGE_REPO }}
      wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
      deploy_sa: ${{ vars.GCP_DEPLOY_SA }}
      # Empty until the temporary prod-*.jainerp.org names exist (§4 of
      # PROD_GCP_SETUP_PROMPT.md). Empty means the post-shift check is skipped,
      # not that it silently passes.
      verify_url: ${{ vars.PROD_VERIFY_URL }}
